<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">workspace-memory</title><desc id="desc">Your agents forget. This doesn't. Coding agents share a local memory.</desc>
  <defs><radialGradient id="bg" cx="74%" cy="48%" r="55%"><stop stop-color="#dffbee"/><stop offset=".5" stop-color="#f5f8f7"/><stop offset="1" stop-color="#fbfcfd"/></radialGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#0eac72"/><stop offset="1" stop-color="#7658db"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#17201c" opacity=".1"/></pattern></defs>
  <style>.thread{stroke-dasharray:5 8;animation:flow 5s linear infinite}.thread:nth-child(2n){animation-direction:reverse}.chip{font:500 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#363c48}.small{font:500 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#697180}.node{font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#161a20}@keyframes flow{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){.thread{animation:none}}</style>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/><rect width="1280" height="400" rx="24" fill="url(#dots)"/><rect x="1" y="1" width="1278" height="398" rx="23" fill="none" stroke="#dce1e7"/>
  <circle cx="62" cy="56" r="5" fill="#0eac72"/><text x="80" y="62" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="600" fill="#15191f">workspace-memory</text>
  <text x="60" y="182" font-family="ui-sans-serif,system-ui,sans-serif" font-size="58" font-weight="650" letter-spacing="-3" fill="#15191f">Your agents forget.</text><text x="60" y="245" font-family="ui-sans-serif,system-ui,sans-serif" font-size="58" font-weight="650" letter-spacing="-3" fill="#0eac72">This doesn't.</text><text x="62" y="295" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" fill="#697180">Shared, local memory for every coding agent in the room.</text>
